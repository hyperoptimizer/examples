# Temporary acceptance-test destination; delete after verifying isolation.
apiVersion: v1
kind: Pod
metadata:
  name: billing-network-peer
  namespace: hyperoptimizer
  labels:
    hyperoptimizer.io/org-id: local-network-other-workspace
    app.kubernetes.io/component: network-acceptance-peer
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: peer
      image: python:3.12-slim
      command: [python, -m, http.server, "8080", --directory, /tmp]
      resources:
        requests: {cpu: 20m, memory: 32Mi}
        limits: {cpu: 100m, memory: 64Mi}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      readinessProbe:
        httpGet: {path: /, port: 8080}
