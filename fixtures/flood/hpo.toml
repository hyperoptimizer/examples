algorithm = "random"
maxTrialCount = 1
parallelTrialCount = 1
maxFailedTrialCount = 1
maxRuntimeSecondsPerTrial = 300
machineSizeId = "nano"
region = "eu-west"
useCustomDockerImage = false
fixedArgs = ["--hpo-duration-seconds=240", "--hpo-bytes-per-second=131072", "--hpo-max-bytes=33554432"]
requiredEnv = []
reportingMode = "stdout"

[build]
context = ".."
dockerfile = "flood/Dockerfile"
repository = "abuse-flood"
platform = "linux/amd64"

[[parameters]]
name = "x"
slug = "x"
type = "double"
min = -2
max = 2

[[parameters]]
name = "y"
slug = "y"
type = "double"
min = -1
max = 3

[[objectives]]
name = "loss"
type = "minimize"

[metricPolicies]
