algorithm = "random"
maxTrialCount = 8
parallelTrialCount = 1
maxFailedTrialCount = 3
maxRuntimeSecondsPerTrial = 180
machineSizeId = "nano"
region = "eu-west"
useCustomDockerImage = false
fixedArgs = ["--hpo-duration-seconds=120"]
requiredEnv = []
reportingMode = "stdout"

[build]
context = ".."
dockerfile = "normal/Dockerfile"
repository = "abuse-normal"
platform = "linux/amd64"

[[parameters]]
name = "x"
slug = "x"
type = "double"
min = -2
max = 2

[[parameters]]
name = "y"
slug = "y"
type = "double"
min = -1
max = 3

[[objectives]]
name = "loss"
type = "minimize"

[metricPolicies]
